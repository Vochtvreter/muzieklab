<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101415" media="(prefers-color-scheme: dark)" />
    <!--
      The theme picked in Settings (the saved prefs, PREFS_KEY in src/game/storage.ts), set before the first paint:
      the page does not show the device's theme first while the app loads. App.tsx keeps it up to date from then on.
      The browser bar takes the first theme-color meta that matches, so the forced one (the colour above for that
      theme) goes before the device's two.
    -->
    <script>
      try {
        const theme = (JSON.parse(localStorage.getItem('muzieklab.prefs.v1')) || {}).theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          const meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = theme === 'dark' ? '#101415' : '#eef1f0';
          meta.setAttribute('data-forced', '');
          document.head.insertBefore(meta, document.querySelector('meta[name="theme-color"]'));
        }
      } catch (e) {
        /* storage blocked, or prefs it cannot read: the app follows the device then too */
      }
    </script>
    <title>Muzieklab</title>
    <meta name="description" content="Practise reading and tapping rhythms." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
