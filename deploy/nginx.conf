# Muzieklab on nginx (docs/DEPLOY.md), if the server runs nginx already; otherwise use the Caddyfile.
# Replace the domain, copy this to /etc/nginx/sites-available/muzieklab, link it into sites-enabled, then
# run sudo nginx -t && sudo systemctl reload nginx, and sudo certbot --nginx -d <your domain> for HTTPS.

# Files in assets/ have a content hash in their name, so they never change: cache them for a year. Everything else
# (index.html, the service worker, the manifest, icons) is checked on each visit, so an update shows.
map $uri $muzieklab_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name muzieklab.example.com;

    # The deploy workflow points current at the newest release.
    root /var/www/muzieklab/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header Cache-Control $muzieklab_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The app routes with #hashes, so every real path is a file.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
