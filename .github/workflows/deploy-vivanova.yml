name: Deploy to vivanova.app
# Builds on every push to main (and by hand) and copies dist/ to the vivanova.app server over SSH.
# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (the folder nginx serves as /muzieklab/, so it must end in
# /muzieklab) and either DEPLOY_SSH_KEY (preferred) or DEPLOY_PASSWORD.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: vivanova, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Copy dist/ to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set"; exit 1; }
          done
          # rsync --delete empties the target first, so refuse anything but a muzieklab folder.
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          case "$DEPLOY_PATH" in
            /*/muzieklab) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path ending in /muzieklab"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            SSH="ssh -i $HOME/.ssh/id_deploy"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass > /dev/null
            SSH="sshpass -e ssh"
          else
            echo "::error::Set DEPLOY_SSH_KEY or DEPLOY_PASSWORD"; exit 1
          fi
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -rlz --delete -e "$SSH" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
