name: CI
# Pull requests are checked on every push to their branch; main is checked after each merge.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    # The API (server/): types, tests against a throwaway MongoDB (mongodb-memory-server), and the bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    # Layout at phone, landscape, tablet and desktop sizes, and one full lesson, against the production build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
  real-api:
    # The app against the real API: the API bundle on a throwaway MongoDB (mongodb-memory-server) and the production
    # build in a real browser, nothing mocked: create-admin, invites, blocking, new passwords, too many tries, deleting
    # an account (e2e/real-api.spec.ts, playwright.real.config.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-api-traces
          path: test-results/
          retention-days: 7
