name: Deploy site
# The deploy itself, shared by deploy.yml (production) and deploy-test.yml (test): run the tests, build, upload the
# build over SSH to <path>/releases/<commit>/ and switch <path>/current to it. Server setup: docs/DEPLOY.md.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment the deploy is recorded under (production, test).
        type: string
        required: true
      path:
        description: The site's folder on the server, which holds releases/ and current.
        type: string
        required: true
      url:
        description: The site's address, checked after the switch.
        type: string
        required: true
      api-path:
        description: The API's folder on the server (releases/ and current); empty while the site has no API.
        type: string
        default: ''
      api-service:
        description: The API's systemd service, restarted after its switch (muzieklab-api@<site>.service).
        type: string
        default: ''
      show-branch:
        description: Build the branch name into the site, which shows it (the test site, so a tester knows what is on it).
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # Tests gate the deploy, so a broken build never reaches the site.
      - run: npm test
      # test after a push to it, or the branch picked under "Use workflow from" for a run started by hand.
      - name: Name the branch
        if: inputs.show-branch
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "VITE_DEPLOY_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Deploys **$BRANCH** ($SHA)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      # The API is one bundled file (server/build.mjs) that reports this commit from /api/v1/health.
      - name: Test and build the API
        if: inputs.api-path != ''
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build
      - if: inputs.api-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: server/dist/
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      DEPLOY_PATH: ${{ inputs.path }}
      API_PATH: ${{ inputs.api-path }}
      API_SERVICE: ${{ inputs.api-service }}
      SITE_URL: ${{ inputs.url }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: inputs.api-path != ''
        uses: actions/download-artifact@v4
        with:
          name: api
          path: api/
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's own host key, so the runner only ever talks to that server.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            Port ${DEPLOY_PORT:-22}
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
      # The API goes first, so the app never switches to a release whose API is not running. Its releases sit in
      # releases/ like the app's; previous records what current pointed at, for the rollback below.
      - name: Upload the API release
        if: inputs.api-path != ''
        run: |
          ssh server "mkdir -p '$API_PATH/releases/$RELEASE'"
          rsync -rlptz --delete api/ "server:$API_PATH/releases/$RELEASE/"
      - name: Switch the API and restart it
        id: api_switch
        if: inputs.api-path != ''
        run: |
          ssh server "set -e
            cd '$API_PATH'
            readlink current > previous || true
            ln -sfn 'releases/$RELEASE' current.tmp
            mv -Tf current.tmp current
            sudo -n systemctl restart '$API_SERVICE'"
      # Waits until the API answers as this release with the database reachable (a minute at most).
      - name: Check the API
        if: inputs.api-path != ''
        run: |
          health="${SITE_URL%/}/api/v1/health"
          for _ in $(seq 1 30); do
            body=$(curl -fsS --max-time 5 "$health" 2>/dev/null || true)
            if grep -q "\"commit\":\"$RELEASE\"" <<<"$body" && grep -q '"db":"ok"' <<<"$body"; then
              echo "$body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$health did not answer as $RELEASE with the database reachable. Last answer: ${body:-none}"
          exit 1
      # A release that does not come up is switched back, so the API is never left down; the deploy still fails.
      - name: Roll the API back
        if: failure() && steps.api_switch.outcome == 'success'
        run: |
          ssh server "set -e
            cd '$API_PATH'
            prev=\$(cat previous 2>/dev/null || true)
            if [ -z \"\$prev\" ]; then echo 'No previous release to go back to.'; exit 0; fi
            ln -sfn \"\$prev\" current.tmp
            mv -Tf current.tmp current
            sudo -n systemctl restart '$API_SERVICE'
            echo \"Back on \$prev.\""
      - name: Remove old API releases
        if: inputs.api-path != ''
        run: ssh server "cd '$API_PATH' && ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf"
      # Each deploy is a new folder in releases/; the site only switches once the whole build is on the server.
      - name: Upload the release
        run: |
          ssh server "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          rsync -rlptz --delete dist/ "server:$DEPLOY_PATH/releases/$RELEASE/"
      # current is a symlink the web server serves; mv -T replaces it in one step, so no request sees a half-new site.
      # The five newest releases stay for a rollback (docs/DEPLOY.md).
      - name: Switch to the release
        run: |
          ssh server "set -e
            cd '$DEPLOY_PATH'
            ln -sfn 'releases/$RELEASE' current.tmp
            mv -Tf current.tmp current
            ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf"
      - name: Check the live site
        if: inputs.url != ''
        run: curl -fsS --retry 3 --retry-all-errors -o /dev/null "$SITE_URL"
