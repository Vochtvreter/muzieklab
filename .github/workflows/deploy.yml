name: Deploy to production
# Every push to main (each merged PR) deploys https://vivanova.app; run it by hand from the Actions tab to redeploy
# without a change. The steps are in deploy-site.yml; server setup and the settings it needs: docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time; a newer push waits for the running one, so releases switch in order.
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    # Skipped until the server is set up (the DEPLOY_HOST repository variable), so main stays green before then.
    if: vars.DEPLOY_HOST != ''
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
      path: ${{ vars.DEPLOY_PATH }}
      url: ${{ vars.PRODUCTION_URL }}
    secrets: inherit
